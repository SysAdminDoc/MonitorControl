name: DDC compatibility report
description: Share a redacted DDC report so monitor quirks can be added to the compatibility database.
title: "DDC compatibility: "
labels:
  - compatibility
body:
  - type: markdown
    attributes:
      value: |
        Please remove serial numbers, device paths, computer names, and any other private data before submitting. The app's Diagnostics page redacts these values by default.
  - type: textarea
    id: report
    attributes:
      label: Redacted compatibility report
      description: Paste the report copied by System > Diagnostics > Submit report.
      render: text
    validations:
      required: true
  - type: input
    id: monitor
    attributes:
      label: Monitor model
      description: Use the model printed on the panel or a redacted EDID manufacturer/model identifier.
    validations:
      required: true
  - type: input
    id: connector
    attributes:
      label: Connector and adapter
      description: For example DisplayPort through a dock, or HDMI directly from an NVIDIA GPU.
    validations:
      required: true
  - type: textarea
    id: symptoms
    attributes:
      label: Symptoms and reproducibility
      description: Describe which reads or writes fail, whether another connector works, and the steps to reproduce.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed serial numbers, device paths, user or computer names, and other private data.
          required: true
